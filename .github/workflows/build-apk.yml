name: Build AsRoxa APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Capacitor and Android Project
      run: |
        mkdir -p www
        cp index.html www/
        cp icon.png www/
        cp manifest.json www/
        npm init -y
        npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
        npx cap init "Calculator" "com.sec.android.app.popupcalculator" --web-dir "www"
        npx cap add android
        npx cap sync android

    - name: Inject Dynamic Version Code for In-Place Update
      run: |
        BUILD_GRADLE="android/app/build.gradle"
        VERSION_CODE="${{ github.run_number }}"
        sed -i "s/versionCode 1/versionCode $VERSION_CODE/g" "$BUILD_GRADLE"
        sed -i 's/versionName "1.0"/versionName "1.0.'$VERSION_CODE'"/g' "$BUILD_GRADLE"

    - name: Inject Android Permissions (Camera, Audio, Storage & Network)
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        PERMS='<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n'
        sed -i "/<application/i $PERMS" "$MANIFEST"

    - name: Force Replace Android App Icons
      run: |
        RES_DIR="android/app/src/main/res"
        for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
          mkdir -p "$RES_DIR/$dir"
          cp -f icon.png "$RES_DIR/$dir/ic_launcher.png"
          cp -f icon.png "$RES_DIR/$dir/ic_launcher_round.png"
          cp -f icon.png "$RES_DIR/$dir/ic_launcher_foreground.png"
        done

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-Vault-AsRoxa
        path: android/app/build/outputs/apk/debug/app-debug.apk
