name: Build AsRoxa APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Capacitor and Android Project
      run: |
        mkdir -p www
        cp index.html www/
        cp icon.png www/
        cp manifest.json www/
        npm init -y
        npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
        npx cap init "Calculator" "com.sec.android.app.popupcalculator" --web-dir "www"
        npx cap add android
        npx cap sync android

    - name: Force Replace Android App Icons
      run: |
        RES_DIR="android/app/src/main/res"
        for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
          mkdir -p "$RES_DIR/$dir"
          cp -f icon.png "$RES_DIR/$dir/ic_launcher.png"
          cp -f icon.png "$RES_DIR/$dir/ic_launcher_round.png"
          cp -f icon.png "$RES_DIR/$dir/ic_launcher_foreground.png"
        done

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-Vault-AsRoxa
        path: android/app/build/outputs/apk/debug/app-debug.apk
