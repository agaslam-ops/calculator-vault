name: Build AsRoxa APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Prepare Web Directory & Capacitor
      run: |
        mkdir -p www
        cp index.html www/
        cp icon.png www/
        cp manifest.json www/
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "Calculator" "com.asroxa.calculatorvault" --web-dir "www"
        npx cap add android
        npx cap sync android

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-Vault-AsRoxa
        path: android/app/build/outputs/apk/debug/app-debug.apk
